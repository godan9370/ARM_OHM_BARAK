<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webcam Line Art</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #eee;
  }
  #stage {
    position: fixed; inset: 0;
    background: #fff;
  }
  canvas#out { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  video, canvas#sample { display: none; }

  #placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 15px; text-align: center; padding: 20px;
    background: #fff;
    cursor: pointer;
  }

  #hideHint {
    position: fixed; top: 14px; right: 14px;
    z-index: 20;
    background: rgba(20,20,20,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #eee; font-size: 12px;
    padding: 7px 10px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    user-select: none;
  }

  .panel {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 20;
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    justify-content: center;
    max-width: min(94vw, 820px);
    background: rgba(20,20,20,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 16px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .panel.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(10px); }

  .field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #bbb; }
  .field input[type="range"] { width: 120px; }
  button {
    background: rgba(255,255,255,0.08); color: #eee; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.16); }
  button:disabled { opacity: 0.4; cursor: default; }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #bbb; }

  #status {
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #ccc; background: rgba(20,20,20,0.6); padding: 6px 10px;
    border-radius: 6px; z-index: 20;
  }
  #status:empty { display: none; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="out"></canvas>
  <canvas id="sample"></canvas>
  <video id="video" playsinline autoplay muted></video>
  <div id="placeholder">Click to start camera</div>
</div>

<div id="hideHint">Press H to hide controls</div>
<div id="status"></div>

<div class="panel" id="panel">
  <button id="toggleBtn">Start Camera</button>
  <button id="fullscreenBtn">Fullscreen</button>
  <button id="saveBtn" disabled>Save PNG</button>

  <div class="field">
    <span>Density (<span id="linesVal"></span>)</span>
    <input type="range" id="lines" min="30" max="200" step="1">
  </div>

  <div class="field">
    <span>Thickness (<span id="thickVal"></span>)</span>
    <input type="range" id="thick" min="20" max="100" step="1">
  </div>

  <div class="field">
    <span>Smoothing (<span id="smoothVal"></span>)</span>
    <input type="range" id="smooth" min="0" max="90" step="1">
  </div>

  <label class="check"><input type="checkbox" id="mirror" checked> Mirror</label>
  <label class="check"><input type="checkbox" id="invert"> Invert</label>
</div>

<script>
(() => {
  const video = document.getElementById('video');
  const outCanvas = document.getElementById('out');
  const sampleCanvas = document.getElementById('sample');
  const stage = document.getElementById('stage');
  const placeholder = document.getElementById('placeholder');
  const toggleBtn = document.getElementById('toggleBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const saveBtn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('status');
  const panel = document.getElementById('panel');
  const hideHint = document.getElementById('hideHint');

  const linesInput = document.getElementById('lines');
  const thickInput = document.getElementById('thick');
  const smoothInput = document.getElementById('smooth');
  const mirrorInput = document.getElementById('mirror');
  const invertInput = document.getElementById('invert');
  const linesVal = document.getElementById('linesVal');
  const thickVal = document.getElementById('thickVal');
  const smoothVal = document.getElementById('smoothVal');

  linesInput.value = 90;
  thickInput.value = 70;
  smoothInput.value = 55;

  const outCtx = outCanvas.getContext('2d');
  const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

  const SAMPLE_W = 200;
  let OUT_W = window.innerWidth, OUT_H = window.innerHeight;
  let SAMPLE_H = Math.max(2, Math.round(SAMPLE_W * OUT_H / OUT_W));

  function resizeCanvases() {
    OUT_W = window.innerWidth;
    OUT_H = window.innerHeight;
    SAMPLE_H = Math.max(2, Math.round(SAMPLE_W * OUT_H / OUT_W));
    outCanvas.width = OUT_W;
    outCanvas.height = OUT_H;
    sampleCanvas.width = SAMPLE_W;
    sampleCanvas.height = SAMPLE_H;
  }
  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);

  let stream = null;
  let rafId = null;
  let prevThickness = null;
  let currentLineCount = -1;
  let t = 0;

  function updateLabels() {
    linesVal.textContent = linesInput.value;
    thickVal.textContent = thickInput.value;
    smoothVal.textContent = smoothInput.value;
  }
  [linesInput, thickInput, smoothInput].forEach(el => el.addEventListener('input', updateLabels));
  updateLabels();

  function ensureBuffer(lineCount) {
    if (lineCount !== currentLineCount) {
      currentLineCount = lineCount;
      prevThickness = new Float32Array(lineCount * SAMPLE_W);
    }
  }

  function luminance(r, g, b) {
    return 0.299 * r + 0.587 * g + 0.114 * b;
  }

  // draw video into ctx covering dW x dH (like CSS object-fit: cover), cropping as needed
  function drawCover(ctx, dW, dH, mirror) {
    const vW = video.videoWidth, vH = video.videoHeight;
    if (!vW || !vH) return false;
    const vRatio = vW / vH, dRatio = dW / dH;
    let sx, sy, sw, sh;
    if (vRatio > dRatio) {
      sh = vH; sw = vH * dRatio; sx = (vW - sw) / 2; sy = 0;
    } else {
      sw = vW; sh = vW / dRatio; sx = 0; sy = (vH - sh) / 2;
    }
    ctx.save();
    if (mirror) { ctx.translate(dW, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, dW, dH);
    ctx.restore();
    return true;
  }

  function renderFrame() {
    rafId = requestAnimationFrame(renderFrame);
    if (video.readyState < 2) return;

    const mirror = mirrorInput.checked;
    const invert = invertInput.checked;
    const lineCount = parseInt(linesInput.value, 10);
    const maxThickPx = (parseInt(thickInput.value, 10) / 100) * (OUT_H / lineCount) * 1.15;
    const minThickPx = 0.6;
    const smoothing = parseInt(smoothInput.value, 10) / 100;

    ensureBuffer(lineCount);

    if (!drawCover(sampleCtx, SAMPLE_W, SAMPLE_H, mirror)) return;

    let data;
    try {
      data = sampleCtx.getImageData(0, 0, SAMPLE_W, SAMPLE_H).data;
    } catch (e) {
      return;
    }

    outCtx.fillStyle = invert ? '#000' : '#fff';
    outCtx.fillRect(0, 0, OUT_W, OUT_H);
    outCtx.fillStyle = invert ? '#fff' : '#000';

    const rowSpacing = OUT_H / lineCount;
    t += 0.02;

    for (let li = 0; li < lineCount; li++) {
      const centerY = (li + 0.5) * rowSpacing;
      const sampleY = Math.min(SAMPLE_H - 1, Math.floor((li + 0.5) / lineCount * SAMPLE_H));

      const topPts = [];
      const botPts = [];

      for (let sx = 0; sx < SAMPLE_W; sx++) {
        const idx = (sampleY * SAMPLE_W + sx) * 4;
        const b = luminance(data[idx], data[idx + 1], data[idx + 2]);
        const darkness = 1 - b / 255;
        let rawThick = minThickPx + darkness * darkness * maxThickPx;

        const wobble = Math.sin(sx * 0.35 + li * 1.7 + t) * 0.4;
        rawThick = Math.max(minThickPx, rawThick + wobble);

        const bufIdx = li * SAMPLE_W + sx;
        const prev = prevThickness[bufIdx];
        const smoothedThick = prev === 0 ? rawThick : prev * smoothing + rawThick * (1 - smoothing);
        prevThickness[bufIdx] = smoothedThick;

        const outX = (sx / (SAMPLE_W - 1)) * OUT_W;
        topPts.push([outX, centerY - smoothedThick / 2]);
        botPts.push([outX, centerY + smoothedThick / 2]);
      }

      outCtx.beginPath();
      outCtx.moveTo(topPts[0][0], topPts[0][1]);
      for (let i = 1; i < topPts.length; i++) outCtx.lineTo(topPts[i][0], topPts[i][1]);
      for (let i = botPts.length - 1; i >= 0; i--) outCtx.lineTo(botPts[i][0], botPts[i][1]);
      outCtx.closePath();
      outCtx.fill();
    }
  }

  async function startCamera() {
    statusEl.textContent = 'Requesting camera access…';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      placeholder.style.display = 'none';
      toggleBtn.textContent = 'Stop Camera';
      saveBtn.disabled = false;
      statusEl.textContent = '';
      currentLineCount = -1;
      cancelAnimationFrame(rafId);
      renderFrame();
    } catch (err) {
      statusEl.textContent = 'Camera access failed: ' + err.message;
    }
  }

  function stopCamera() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (stream) {
      stream.getTracks().forEach(tr => tr.stop());
      stream = null;
    }
    video.srcObject = null;
    placeholder.style.display = 'flex';
    toggleBtn.textContent = 'Start Camera';
    saveBtn.disabled = true;
    outCtx.fillStyle = '#fff';
    outCtx.fillRect(0, 0, OUT_W, OUT_H);
  }

  toggleBtn.addEventListener('click', () => { stream ? stopCamera() : startCamera(); });
  placeholder.addEventListener('click', () => { if (!stream) startCamera(); });

  saveBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'line-art-' + Date.now() + '.png';
    link.href = outCanvas.toDataURL('image/png');
    link.click();
  });

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      stage.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  });

  let controlsHidden = false;
  function setControlsHidden(hidden) {
    controlsHidden = hidden;
    panel.classList.toggle('hidden', hidden);
    hideHint.style.opacity = hidden ? '0' : '1';
    hideHint.style.pointerEvents = hidden ? 'none' : 'auto';
  }
  hideHint.addEventListener('click', () => setControlsHidden(true));
  window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'h') setControlsHidden(!controlsHidden);
  });

  // initial blank canvas
  outCtx.fillStyle = '#fff';
  outCtx.fillRect(0, 0, OUT_W, OUT_H);
})();
</script>

</body>
</html>
